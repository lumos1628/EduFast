spring.application.name=eduFast-backend

# ==== Base de datos (PostgreSQL local) ====
# En producción, usar variables de entorno: DB_URL, DB_USER, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/edufast}
spring.datasource.username=${DB_USER:edufast}
spring.datasource.password=${DB_PASSWORD:edufast123}

# JPA genera/actualiza las tablas solas desde las entidades de infrastructure/persistence/entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Desactivado: obliga a que las consultas traigan lo necesario (evita el problema N+1 oculto)
spring.jpa.open-in-view=false

# ==== JWT (login) ====
# En producción, poner la clave real en la variable de entorno JWT_SECRET
edufast.jwt.secret=${JWT_SECRET:cambia-esta-clave-en-produccion-edufast-2026-super-secreta-1234567890}
# Expiración del token en milisegundos (86400000 = 1 día)
edufast.jwt.expiration=86400000

server.port=8080
